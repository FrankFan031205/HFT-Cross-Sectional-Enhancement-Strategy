project:
  name: cs_hidden_factor_h60
  version: v1

data:
  cs_dataset_path: CrossSectionalModel/data/processed/cs_dataset_h60_202410_100.csv
  output_path: CrossSectionalModel/outputs/hidden_factors/hidden_cs_models_h60_202410_100.csv
  model_dir: CrossSectionalModel/outputs/models

columns:
  datetime_col: datetime
  symbol_col: securityid
  label_col: label_60
  target_col: label_cs_60_rank
  label_excess_col: label_cs_60_demean
  feature_suffix: _cs_z

split:
  train_start: "20241022"
  train_end: "20241028"
  valid_start: "20241029"
  valid_end: "20241029"
  test_start: "20241030"
  test_end: "20241031"

training:
  chunksize: 500000
  max_train_rows: 2000000
  max_valid_rows: 500000
  random_state: 42
  fillna_value: 0.0

models:
  ridge:
    enabled: true
    alpha: 10.0

  lgbm:
    enabled: true
    params:
      n_estimators: 300
      learning_rate: 0.03
      num_leaves: 31
      max_depth: 6
      subsample: 0.8
      colsample_bytree: 0.8
      reg_alpha: 1.0
      reg_lambda: 10.0
      min_child_samples: 500
      random_state: 42
      n_jobs: 16
