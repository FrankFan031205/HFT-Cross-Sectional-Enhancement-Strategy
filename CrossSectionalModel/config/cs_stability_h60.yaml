project:
  name: cs_factor_stability_h60
  version: v1

data:
  cs_dataset_path: CrossSectionalModel/data/processed/cs_dataset_h60_202410_100.csv
  eval_path: CrossSectionalModel/outputs/cs_factor_eval_h60_202410_100.csv
  output_dir: CrossSectionalModel/outputs/stability_h60_202410_100

columns:
  datetime_col: datetime
  label_col: label_60
  label_rank_col: label_cs_60_rank
  label_excess_col: label_cs_60_demean

factors:
  mode: top_n
  top_n: 20
  sort_by:
    - mean_rankic
    - top20_excess_return
  include_suffix: _cs_z

evaluation:
  top_quantile: 0.2
  bottom_quantile: 0.2
  min_obs_per_datetime: 30
  batch_size: 5

intraday_buckets:
  - name: open_0930_1000
    start: "09:30:00"
    end: "10:00:00"
  - name: morning_1000_1130
    start: "10:00:00"
    end: "11:30:00"
  - name: afternoon_1300_1430
    start: "13:00:00"
    end: "14:30:00"
  - name: close_1430_1500
    start: "14:30:00"
    end: "15:00:00"
