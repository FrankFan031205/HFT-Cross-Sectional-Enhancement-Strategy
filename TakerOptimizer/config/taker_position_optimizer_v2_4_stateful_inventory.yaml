project:
  name: taker_position_optimizer
  version: v2_4_stateful_inventory
  seed: 42
data:
  market_data_path: PricingModel/data/market_return_202410_100_enriched.csv
  pricing_path: PricingModel/output/pricing_30d_ret120_all_60factors_common_universe/pricing/cs_dl_cnn_gru_h30/priced_dataset.csv
  barra_proxy_path: CrossSectionalModel/data/barra_proxy/barra_proxy_20241022_20250114.csv
  output_path: TakerOptimizer/outputs/target_positions/taker_target_positions_v2_6_lgbm_h60_202410_100_gross80.csv
  log_path: TakerOptimizer/outputs/logs/taker_position_optimizer_v2_6_lgbm_h60_202410_100_gross80.log
  rank_alpha_path: FactorModel/outputs/hidden_factor_lgbm_h60_202410_100.csv
columns:
  date_col: date
  datetime_col: datetime
  symbol_col: securityid
  alpha_col: pred_ret_cs_dl_cnn_gru_h30
  fair_price_col: fair_price_cs_dl_cnn_gru_h30
  price_col: mid_price
  bid_col: bid1
  ask_col: ask1
  spread_col: spread
  bid_volume_col: bid1_volume
  ask_volume_col: ask1_volume
  limit_up_col: limit_up_price
  limit_down_col: limit_down_price
  industry_col: industryID1
  barra_style_cols:
  - size_z
  - liquidity_z
  - value_z
  - momentum_z
  - volatility_z
  rank_alpha_col: hidden_factor_lgbm_h60
optimizer:
  capital: 200000000
  portfolio_mode: inventory_constrained
  base_gross_limit: 0.5
  max_gross_limit: 0.8
  single_name_limit: 0.03
  turnover_limit: 0.05
  min_names_per_timestamp: 20
  taker_fee_bps: 1.0
  impact_bps: 0.5
  entry_edge_bps: -9999.0
  add_edge_bps: -9999.0
  hold_edge_bps: -9999.0
  exit_edge_bps: 2.0
  max_spread_bps: 80.0
  volume_cap_ratio: 0.2
  min_trade_notional: 10000
  rebalance_interval_min: 5
  rebalance_smoothing: 0.5
  target_weight_band: 5.0e-05
  min_hold_minutes: 5
  trade_cooldown_minutes: 2
  max_stale_hold_minutes: 10
  block_before_time: 09:35:00
  block_after_time: '14:50:00'
  enforce_sellable_inventory: true
  risk_aversion: 1.0
  barra_risk_aversion: 0.2
  industry_risk_aversion: 0.1
  turnover_penalty: 0.05
  style_limit: 0.03
  industry_limit: 0.03
  lot_size: 100
  chunksize: 1000000
  solver: OSQP
  entry_top_n: 50
  add_top_n: 50
  hold_top_n: 80
  exit_rank_n: 95
  target_gross_limit: 0.5
