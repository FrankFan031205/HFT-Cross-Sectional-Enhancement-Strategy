strategy:
  name: pure_cs_cvxpy_h20_r10_v1_t1aware
  capital: 200000000
  prediction_horizon_min: 20
  rebalance_interval_min: 10
  # index = every N-th available timestamp per trading day
  # clock = timestamps whose minute-of-day is divisible by interval
  rebalance_by: index

input:
  # 改成你的真实输入路径。支持 parquet/csv/csv.gz，支持 glob。
  path_glob: "/mnt/data1/fwz/HFT_010-dev_fwz_outputs/TakerPipeline/zzy_pure_cs_h20_res_minute_input/*.parquet"
  paths: []

  # 如果输入是 3s/500ms/realtime，先每分钟每股票保留最后一条。
  resample_to_minute: false
  symbol_zfill: 6

columns:
  date: date
  datetime: datetime
  symbol: securityid

  # h20 信号列。如果你的列名不同，改这里，比如 pred_ret / pred_ret_h20 / signal_h20。
  signal: pred_ret_h20

  price: mid_price
  bid: bid1
  ask: ask1
  bid_volume: bid_volume1
  ask_volume: ask_volume1

  # 没有 benchmark_weight 时，脚本会自动 fallback 成当期截面等权 benchmark。
  benchmark_weight: benchmark_weight

  # 没有这些列也可以，脚本会自动跳过对应限制。
  limit_up_price: limit_up
  limit_down_price: limit_down
  market_turnover_amount: turnover_amount
  industry: industry

alpha:
  # raw: 直接使用真实收益预测；rank: 用截面rank并乘scale；zscore: 用标准化信号并乘scale。
  method: raw
  scale: 1.0
  winsor_low: 0.01
  winsor_high: 0.99

  neutralize: false
  neutralize_style_cols:
    - marketValue
    - volatility_60
    - turnoverRate
  standardize_after_neutralize: false

portfolio:
  gross_target: 0.95
  gross_min: 0.90
  gross_hard_min: 0.80
  gross_max: 0.98
  long_only: true

  single_name_cap: 0.01
  cap_at_least_benchmark: true

  active_l1_limit: 0.35
  lambda_active: 0.0001

cost:
  fill_mode: opponent_price
  fee_rate: 0.001        # 10bp 单边手续费
  lambda_turnover: 0.0005

turnover:
  limit_per_rebalance: 0.02       # h20_r10: 每次rebalance最多换 2% capital
  daily_budget: 0.80              # 每天最多 80% capital 换手，不含首次建仓
  initial_build_limit: 1.00
  initial_build_ignore_daily_budget: true

  min_trade_notional: 20000
  lot_size: 100
  renormalize_after_min_trade: false

execution_constraints:
  use_limit_up_down: true

  use_volume_cap: true
  participation: 0.10

  use_market_turnover_cap: false
  market_turnover_participation: 0.02

risk_constraints:
  use_industry_constraint: false
  industry_tol: 0.02

  use_style_constraint: false
  style_cols:
    - marketValue
    - volatility_60
    - turnoverRate
  style_tol: 0.02

solver:
  solvers:
    - OSQP
    - CLARABEL
    - SCS
  verbose: false

output:
  dir: "/mnt/data1/fwz/HFT_010-dev_fwz/TakerOptimizer/outputs/pure_cs_cvxpy_h20_r10_v1_t1aware"
  target_file: "target_positions.csv"
  summary_file: "summary_by_rebalance.csv"
  config_snapshot_file: "config_used.yaml"


t1_aware:
  enabled: true
  lambda_active_l1_slack: 0.05
  allow_current_cap_breach: true
  hard_active_l1: false

  # 今日买入变 frozen，当日不能卖；换日后 frozen 释放成 sellable
  lambda_buy_lock: 0.00005

  # 正常阶段只允许买入 alpha 排名前 35% 的股票
  buy_rank_quantile: 0.65

  # false = 已有持仓但 alpha 不够高，也不允许继续加仓
  allow_buy_existing: false

  # 初始建仓阶段不限制 buy gate，否则容易建不满仓
  initial_build_ignore_buy_gate: true
