project:
  name: taker_position_optimizer
  version: v2_8_local_global
  seed: 42

data:
  market_data_path: PricingModel/data/market_return_202410_100_enriched.csv
  global_alpha_path: FactorModel/outputs/hidden_factor_lgbm_h60_202410_100.csv
  local_alpha_path: FactorModel/outputs/hidden_factor_lgbm_h60_202410_100.csv
  pricing_path: PricingModel/output/pricing_30d_ret120_all_60factors_common_universe/pricing/cs_dl_cnn_gru_h30/priced_dataset.csv
  output_path: TakerOptimizer/outputs/target_positions/taker_target_positions_v2_8_lgbm_h60_local_global_100.csv
  log_path: TakerOptimizer/outputs/logs/taker_position_optimizer_v2_8_lgbm_h60_local_global_100.log

columns:
  date_col: date
  datetime_col: datetime
  symbol_col: securityid

  global_alpha_col: hidden_factor_lgbm_h60
  local_alpha_col: hidden_factor_lgbm_h60

  pricing_pred_col: pred_ret_cs_dl_cnn_gru_h30
  fair_price_col: fair_price_cs_dl_cnn_gru_h30

  price_col: mid_price
  bid_col: bid1
  ask_col: ask1
  spread_col: spread
  bid_volume_col: bid1_volume
  ask_volume_col: ask1_volume
  limit_up_col: limit_up_price
  limit_down_col: limit_down_price

optimizer:
  capital: 200000000

  target_gross_limit: 0.60
  max_gross_limit: 0.80
  single_name_limit: 0.025
  turnover_limit: 0.08

  global_top_n: 50
  global_exit_rank_n: 70
  global_ewma_halflife_min: 15

  portfolio_rebalance_interval_min: 5
  rebalance_smoothing: 0.80
  exit_smoothing: 0.80
  target_weight_band: 0.00003

  min_hold_minutes: 10
  trade_cooldown_minutes: 2

  use_local_buy_gate: true
  local_buy_top_n: 70
  local_buy_edge_min_bps: -5.0

  max_spread_bps: 100.0
  volume_cap_ratio: 0.35
  min_trade_notional: 10000

  block_before_time: "09:35:00"
  block_after_time: "14:50:00"

  lot_size: 100
  chunksize: 1000000
