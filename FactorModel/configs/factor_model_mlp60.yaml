project:
  name: factor_model_mlp60_h60
  version: v1
  seed: 42

data:
  processed_data_path: data/processed/factor_features_202410_100_processed.csv
  date_col: date
  datetime_col: datetime
  symbol_col: securityid
  feature_cols_path: data/raw/feature_cols_202410_100.yaml
  label_col: label_60

  train_start: 20241022
  train_end: 20241028
  valid_start: 20241029
  valid_end: 20241029
  test_start: 20241030
  test_end: 20241031

model:
  type: residual_mlp
  params:
    input_proj_dim: 128
    hidden_dim: 128
    num_blocks: 30
    layers_per_block: 2
    dropout: 0.10
    layer_norm: true

train:
  batch_size: 32768
  epochs: 8
  patience: 2
  learning_rate: 0.0005
  weight_decay: 0.00001
  label_scale: 10000.0
  device: cuda
  model_path: models/mlp60_h60_202410_100.pt

prediction:
  output_col: hidden_factor_mlp60_h60
  output_path: outputs/hidden_factor_mlp60_h60_202410_100.csv

output:
  metrics_path: outputs/model_metrics_mlp60_h60_202410_100.csv